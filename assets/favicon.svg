  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Brain/AI icon -->
  <g transform="translate(64,64)" fill="none" stroke="url(#brain)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-6,-28 C-20,-28 -30,-18 -30,-6 C-30,0 -27,5 -22,8 C-27,11 -30,17 -28,24 C-26,30 -20,34 -14,34 C-10,34 -6,32 -4,29"/>
    <path d="M-6,-28 C-6,-22 -10,-16 -16,-12"/>
    <path d="M-22,8 C-16,8 -10,4 -6,0"/>
