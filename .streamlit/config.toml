# =============================================================================
# Streamlit Configuration - Produção
# Ref: https://docs.streamlit.io/develop/api-reference/configuration
# =============================================================================

[global]
developmentMode = false
disableWatchdogWarning = true

[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 50
maxMessageSize = 200
enableStaticServing = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8510

[theme]
base = "dark"
primaryColor = "#667eea"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#fafafa"
font = "sans serif"

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[runner]
magicEnabled = true
fastReruns = true
enforceSerializableSessionState = false
